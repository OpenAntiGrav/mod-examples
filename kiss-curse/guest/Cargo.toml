# Its own workspace: not a member of OpenAntiGrav's, and built for
# wasm32-unknown-unknown only (`build.sh`).
[workspace]

[package]
name = "kiss-curse"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
