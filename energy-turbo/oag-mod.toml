# Energy Turbo: a pickup of its own, handed out in place of every second Turbo. A
# simulation mod (docs/architecture/wasm-extensions/): it runs only in a build with the
# `extensions` cargo feature, in races with weapons. Rules are in guest/src/lib.rs;
# ext/energy_turbo.wasm is `guest/build.sh`'s output, committed.

toml-schema = { location = "https://oag.topaxi.com/mods/schemas/v1/mod.tosd", version = "1.0.0" }

[mod]
id = "oag.energy-turbo"
name = "Energy Turbo"
version = "1.0.0"
authors = ["The OpenAntiGrav contributors"]
license = "MIT OR Apache-2.0"
description = "Every second Turbo pickup is an energy turbo instead: hold fire to boost on your shield, absorb for half of it back, pads refill instead of boosting."
repository = "https://github.com/OpenAntiGrav/mod-examples"
titles = ["wipeout-pulse"]

[extension]
simulation = true
api = 1
memory_pages = 2
# 8 grid slots of 12 bytes each (guest `Memory`).
state_bytes = 96

[extension.rules]
module = "ext/energy_turbo.wasm"

# The mod's own particle effects (schemas/v1/effect.tosd), named by their place in this
# table's name order from `fire_mod_effect`.
[effects]
discharge = "fx/discharge.toml"
