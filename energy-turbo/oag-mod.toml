# Energy Turbo: a pickup of its own, handed out in place of every second Turbo, drawn
# as the Turbo on a red backdrop.
# Hold fire to boost for as long as the pool lasts, paid for in shield energy; absorb
# it to get half of what you spent back; carry it over a speed pad and the pad fills
# the pool instead of boosting. Spending your shield is the risk: a hit on an empty
# pool wrecks you. A simulation mod (OpenAntiGrav's docs/architecture/wasm-extensions/):
# runs only in a build with the `extensions` cargo feature, in races with weapons.
#
# Built from guest/ (`guest/build.sh`); ext/energy_turbo.wasm is that build, committed.

toml-schema = { location = "https://oag.topaxi.com/mods/schemas/v1/mod.tosd", version = "1.0.0" }

[mod]
id = "oag.energy-turbo"
name = "Energy Turbo"
version = "1.0.0"
authors = ["The OpenAntiGrav contributors"]
license = "MIT OR Apache-2.0"
description = "Every second Turbo pickup is an energy turbo instead: hold fire to boost on your shield, absorb for half of it back, pads refill instead of boosting."
repository = "https://github.com/OpenAntiGrav/mod-examples"
titles = ["wipeout-pulse"]

[extension]
simulation = true
api = 1
memory_pages = 2
# Per grid slot, 12 bytes: energy spent (f32), AI burst ticks (u16), boosting last
# tick (u8), spark countdown (u8), AI burst-and-rest ticks (u16), 2 spare.
state_bytes = 96

[extension.rules]
module = "ext/energy_turbo.wasm"
