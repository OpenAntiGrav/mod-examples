# Its own workspace, built for wasm32-unknown-unknown by `build.sh`; `cargo test` runs
# the logic natively.
[workspace]

[package]
name = "energy-turbo"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# A stand-alone clone needs a git dependency on the engine, pinned to the ABI revision
# the committed module was built for.
[dependencies]
oag-ext = { path = "../../../../../crates/ext" }

[dev-dependencies]
oag-ext = { path = "../../../../../crates/ext", features = ["test"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
