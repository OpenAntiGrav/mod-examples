# The ring a new lock throws on the road ahead: drawn by fx/ring.wgsl, one particle standing
# for a second.

toml-schema = { location = "https://oag.topaxi.com/mods/schemas/v1/effect.tosd", version = "1.0.0" }

axis = "up"

[[emitter]]
name = "ring"
duration = 1
per-emission = 1
lifetime = [60, 0]
speed = [0.0, 0.0]
spread = 0
drag = 1.0
live-cap = 2
size = [[0.0, 6.0], [1.0, 16.0]]
alpha = [[0.0, 1.0], [0.6, 1.0], [1.0, 0.0]]
colour = [[0.0, "#20c0ff"]]
shader = "ring"
