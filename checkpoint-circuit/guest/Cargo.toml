# Its own workspace: not a member of OpenAntiGrav's. Built for
# wasm32-unknown-unknown (`build.sh`); `cargo test` runs its logic natively.
[workspace]

[package]
name = "checkpoint-circuit"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# The guest SDK, from the engine repository this submodule sits in. A stand-alone
# clone needs a git dependency on the engine instead, pinned to the ABI revision the
# committed module was built for.
[dependencies]
oag-ext = { path = "../../../../../crates/ext" }

[dev-dependencies]
oag-ext = { path = "../../../../../crates/ext", features = ["test"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
