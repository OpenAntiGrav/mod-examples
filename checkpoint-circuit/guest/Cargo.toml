# Its own workspace: not a member of OpenAntiGrav's. Built for
# wasm32-unknown-unknown (`build.sh`); `cargo test` runs its logic natively.
[workspace]

[package]
name = "checkpoint-circuit"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# The guest SDK, pinned to the engine commit the committed module was built against.
# Inside the engine checkout, `assets/mods/.cargo/config.toml` patches it to the
# engine's own `crates/ext`; bump `rev` with every SDK change (`just check-ext-pin`).
[dependencies]
oag-ext = { git = "https://github.com/topaxi/OpenAntiGrav", rev = "fa984901efbf0c2efb0193fb2c038f5fcc3507b2" }

[dev-dependencies]
oag-ext = { git = "https://github.com/topaxi/OpenAntiGrav", rev = "fa984901efbf0c2efb0193fb2c038f5fcc3507b2", features = ["test"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
